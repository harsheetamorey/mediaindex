name: windows-app

# Builds the Windows desktop app and checks that the packaged app starts (server, UI and FFmpeg; no window, no models).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packaging/windows/**
      - scripts/build_windows_app.ps1
      - backend/mediaindex/desktop.py
      - .github/workflows/windows-app.yml
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the app
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows_app.ps1
      - name: Start the packaged app (no window, no models)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $env:MEDIAINDEX_DATA_DIR = "$env:RUNNER_TEMP\mi-data"
          $p = Start-Process -PassThru -FilePath dist-app\MediaIndex\MediaIndex.exe -ArgumentList "--serve-check", "$env:RUNNER_TEMP\check.json"
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "the packaged app did not exit within 5 minutes" }
          Get-Content "$env:RUNNER_TEMP\check.json"
          if (-not (Get-Content "$env:RUNNER_TEMP\check.json" | ConvertFrom-Json).ok) { throw "the packaged app did not start" }
      - name: Check the zip uses "/" in its paths
        shell: bash
        run: |
          python -c "import zipfile,glob,sys; n=zipfile.ZipFile(glob.glob('dist-app/MediaIndex-*-windows-x64.zip')[0]).namelist(); bad=[x for x in n if chr(92) in x]; print(len(n), 'entries,', len(bad), 'with backslashes'); sys.exit(1 if bad or 'MediaIndex/MediaIndex.exe' not in n else 0)"
      - uses: actions/upload-artifact@v4
        with:
          name: MediaIndex-windows-x64
          path: dist-app/MediaIndex-*-windows-x64.zip
          retention-days: 14
