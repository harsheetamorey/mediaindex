[project]
name = "mediaindex"
version = "0.1.0"
description = "Local, open-source media-search workspace for creators"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "python-multipart",
    # Model stack: pinned after real verification on the target laptop (docs/model-compatibility.md)
    "torch==2.14.1",
    "torchvision==0.29.1",
    "torchcodec==0.17.0",
    "transformers==5.19.0",
    "sentence-transformers==6.1.0",
    # Media / numerics
    "numpy==2.5.3",
    "pillow==12.3.0",
    "soundfile==0.14.0",
]

[project.optional-dependencies]
demo = [
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/mediaindex"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["real_model: requires downloaded EmbeddingGemma 2 weights (opt-in)"]
addopts = "-m 'not real_model'"
