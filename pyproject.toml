[project]
name = "mediaindex"
version = "0.1.0"
description = "Local, open-source media-search workspace for creators"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/mediaindex"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["real_model: requires downloaded EmbeddingGemma 2 weights (opt-in)"]
addopts = "-m 'not real_model'"
